server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Revalidate mutable pages/assets; no stale navigation after an update.
    add_header Cache-Control "no-cache" always;

    location /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    location ^~ /console/docs {
        return 302 /docs/;
    }
    location ~ ^/(apps|console|auth|members|kyb)(/|$) {
        return 302 /login/;
    }
    location ~ ^/(catalog|products)(/|$) {
        return 302 "/#capabilities";
    }
    location ~ ^/onboarding(/|$) {
        return 302 "/#onboarding";
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
